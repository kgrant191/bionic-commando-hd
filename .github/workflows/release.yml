name: Publish HD pack
on:
  push:
    tags:
      - 'v1.1.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installer
        run: python3 scripts/package_release.py dist/Bionic_Commando_HD_v1.1.0.zip
      - name: Verify installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=dist/Bionic_Commando_HD_v1.1.0.zip
          python3 -m zipfile -t "$asset"
          awk '/^# Bionic Commando HD v1.0.0$/{exit} {print}' RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Bionic Commando HD $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if [[ $(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft) == true ]]; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fx "$(basename "$asset")"
